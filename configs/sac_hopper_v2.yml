# SAC — Hopper-v5, candidato v2 (Parte 3).
#
# Única mudança em relação a configs/sac_hopper.yml: updates_per_step 1 -> 2.
# Hipótese: o SAC é off-policy, então mais passos de gradiente por passo de
# ambiente extrai mais sinal do mesmo buffer de replay, ao custo de tempo de
# relógio (que o enunciado deixa livre nesta parte). Testar se dobrar os
# updates por step já é visivelmente melhor que o ruído entre seeds.

algorithm: sac
env_id: Hopper-v5
seed: 1
cuda: false
total_timesteps: 100000
num_envs: 1

track: true
capture_video: true
save_model: true
checkpoint_every: 25000

network: SACAgent
network_kwargs:
  activation: ReLU
  hidden_layers_size: 256

sac:
  buffer_size: 1000000
  gamma: 0.99
  tau: 0.005
  batch_size: 256
  learning_starts: 5000
  policy_lr: 3.0e-4
  q_lr: 1.0e-3
  policy_frequency: 2
  target_network_frequency: 1
  alpha: 0.2
  autotune: true
  updates_per_step: 2
  clipped_double_q: true
